name: Build Android Exambro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-exambro/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Ensure Permanent Release Keystore Exists
        run: |
          if [ ! -f android-exambro/release.jks ]; then
            echo "Generating permanent release keystore..."
            keytool -genkeypair -v \
              -keystore android-exambro/release.jks \
              -alias exambro \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass exambro123 \
              -keypass exambro123 \
              -dname "CN=Ujian Madrasah, OU=Pendidikan Madrasah, O=Kemenag, L=Jakarta, ST=Jakarta, C=ID"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android-exambro/release.jks
            git commit -m "chore: buat permanent release keystore resmi" || true
            git push || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Signed Release and Debug APK
        run: |
          cd android-exambro
          gradle assembleRelease assembleDebug --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Exambro-Madrasah-Release-APK
          path: android-exambro/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Exambro-Madrasah-Debug-APK
          path: android-exambro/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Extract Version Info & Prepare Release Assets
        id: version_info
        run: |
          VERSION_NAME=$(grep -m 1 'versionName =' android-exambro/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m 1 'versionCode =' android-exambro/app/build.gradle.kts | sed -E 's/.*= *([0-9]+).*/\1/')
          echo "VERSION_NAME=${VERSION_NAME:-1.0.4}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE:-5}" >> $GITHUB_ENV

          mkdir -p release-assets
          RELEASE_APK=$(find android-exambro/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" release-assets/ExambroMadrasah.apk
            cp "$RELEASE_APK" "release-assets/ExambroMadrasah-v${VERSION_NAME:-1.0.4}.apk"
            echo "Release APK assets prepared successfully:"
            ls -lh release-assets
          else
            echo "Error: Release APK not found!"
            exit 1
          fi

      - name: Publish Official GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "Exambro Madrasah v${{ env.VERSION_NAME }}"
          body: |
            ## Rilis Resmi Aplikasi Exambro Madrasah v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})

            Aplikasi resmi ujian online madrasah mandiri berprestasi dengan keamanan tinggi dan penguncian sistem ujian.

            ### Link Download Langsung (.apk):
            - **[ExambroMadrasah.apk (Unduh Otomatis)](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/ExambroMadrasah.apk)**
          files: |
            release-assets/ExambroMadrasah.apk
            release-assets/ExambroMadrasah-v${{ env.VERSION_NAME }}.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
