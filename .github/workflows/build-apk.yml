name: Build Android Exambro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-exambro/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x android-exambro/gradlew

      - name: Build Debug APK
        run: |
          cd android-exambro
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exambro-Madrasah-APK
          path: android-exambro/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
