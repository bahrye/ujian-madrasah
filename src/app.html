<!DOCTYPE html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Aplikasi Ujian Online Madrasah — Platform ujian digital modern untuk madrasah" />
		<meta name="theme-color" content="#4F46E5" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
		<title>Ujian Online Madrasah</title>
		<script>
			// Guard against Chrome DevTools Soft Navigation internal bug (reportAllChanges / reading 'startTime')
			try {
				window.devToolsReportSoftNavs = false;
				window.addEventListener('error', function(event) {
					if (event && event.message && event.message.includes("reading 'startTime'")) {
						event.stopImmediatePropagation();
						event.preventDefault();
					}
				}, true);
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
